on:
  workflow_run: { workflows: ["CI"], types: [completed] }
  workflow_dispatch: { inputs: { pr_number: { required: true } } }
jobs:
  review:
    uses: billy-the-ape/claude-plugins/.github/workflows/claude-review.yml@main
    secrets: inherit
    permissions: { contents: read, pull-requests: write, issues: write, actions: read, id-token: write, statuses: write }